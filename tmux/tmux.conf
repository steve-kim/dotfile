# <prefix>f — fuzzy-pick a worktree and switch to/create its tmux window
bind-key f run-shell "tmux new-window '~/.local/bin/tmux-sessionizer #{pane_current_path}'"
bind-key W display-popup -E "~/.local/bin/tmux-layout"
bind-key l last-window

set -g automatic-rename off

bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

bind-key r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind-key q confirm-before -p "Kill window #W? (y/n)" kill-window

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-cpu'

# ── tmux-resurrect ───────────────────────────────────────────────────────────
set -g @resurrect-strategy-nvim 'session'

# ── tmux-continuum ───────────────────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# ── catppuccin theme ─────────────────────────────────────────────────────────
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g  status-right ""
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"

# TPM — keep this line last
run '~/.config/tmux/plugins/tpm/tpm'
